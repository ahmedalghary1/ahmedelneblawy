    .dialog-foot { display: flex; justify-content: space-between; align-items: center; gap: .5rem; padding: .75rem 1rem; border-block-start: 1px solid var(--line); }

    /* Motion */
    #preloader { display: none; }
    .motion #preloader {
      position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
      background: var(--bg); text-align: center; transition: transform .9s cubic-bezier(.77,0,.18,1), visibility 0s .9s;
    }
    #preloader.done { transform: translateY(-100%); visibility: hidden; pointer-events: none; }
    .loader-box { display: grid; gap: .5rem; width: min(19rem, 70vw); }
    .loader-box strong { color: var(--accent); font: 800 4rem/1.1 Inter, sans-serif; }
    .loader-track { height: 4px; margin-top: .65rem; border-radius: 4px; background: var(--soft); overflow: hidden; }
    .loader-track::after { content: ""; display: block; width: 100%; height: 100%; transform-origin: left; background: var(--gradient); animation: load 1.1s linear both; }
    @keyframes load { from { transform: scaleX(0); } }
    .scroll-progress { position: fixed; z-index: 6; inset: 0 0 auto; height: 3px; transform: scaleX(var(--progress, 0)); transform-origin: left; background: var(--gradient); pointer-events: none; }
    [dir="rtl"] .scroll-progress { transform-origin: right; }
    .hero { position: relative; overflow: hidden; }
    .hero-grid { position: relative; }
    .hero-orb { position: absolute; width: min(40vw, 27rem); aspect-ratio: 1; border-radius: 50%; filter: blur(85px); pointer-events: none; opacity: .36; }
    .orb-start { top: 0; inset-inline-start: -5rem; background: #8e375b; }
    .orb-end { bottom: -4rem; inset-inline-end: 0; background: #ba597b; }
    .motion .hero-orb { animation: drift 14s ease-in-out infinite alternate; }
    .motion .orb-end { animation-delay: -6s; }
    @keyframes drift { to { translate: 40px -50px; scale: 1.2; } }
    #title { position: relative; }
    #title .name-line { color: inherit; }
    #title .name-line + .name-line { color: var(--accent); }
    .name-line b { display: inline-block; font-weight: inherit; }
    .motion .name-line b { animation: name-rise .9s cubic-bezier(.2,.8,.2,1) var(--entry-delay) both; translate: var(--hero-x, 0px) var(--hero-y, 0px); }
    .motion .name-line + .name-line b { background: linear-gradient(110deg, var(--accent) 10%, var(--text) 45%, var(--accent) 80%); background-size: 200%; background-position-x: var(--shine-x, 0%); background-clip: text; color: transparent; }
    .motion #title::after { content: ""; position: absolute; inset-inline-start: 0; bottom: -.65rem; height: 3px; border-radius: 4px; background: var(--gradient); animation: underline 1s 2.5s both; }
    @keyframes name-rise { from { opacity: 0; transform: translateY(110%) skewY(7deg); filter: blur(8px); } }
    @keyframes underline { from { width: 0; } to { width: clamp(5rem, 14vw, 9rem); } }
    .motion .hero-copy > :is(.role, #tagline, .actions, .availability, .stats) { animation: slide-up .8s 1.8s both; }
    @keyframes slide-up { from { opacity: 0; transform: translateY(22px); } }
    .motion .availability::before { animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--accent); } 70%, 100% { box-shadow: 0 0 0 10px transparent; } }
    .hero-visual { position: relative; min-width: 0; perspective: 1000px; }
    @property --portrait-angle { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
    .motion .portrait { background: repeating-linear-gradient(130deg, transparent 0 18px, #ffffff0d 18px 19px), conic-gradient(from var(--portrait-angle), #581b36, #ae5275, #842d50, #581b36); animation: portrait-in 1s 1.5s both, portrait-spin 6s linear infinite, portrait-bob 5s 2.6s ease-in-out infinite alternate; }
    .motion .portrait img { animation: photo-in 1.5s 1.6s both; object-position: calc(50% + var(--hero-x, 0px)) calc(35% + var(--hero-y, 0px)); transition: scale .6s; }
    .motion .portrait:hover img { scale: 1.05; }
    .motion .portrait::after, .motion .about-avatar::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(110deg, transparent 38%, #ffffff49 50%, transparent 62%); animation: shimmer 5.5s 3s ease-in-out infinite both; }
    @keyframes portrait-in { from { opacity: 0; scale: .4; } }
    @keyframes portrait-spin { to { --portrait-angle: 360deg; } }
    @keyframes portrait-bob { to { translate: 0 -7px; } }
    @keyframes photo-in { from { opacity: 0; scale: 1.35; filter: blur(14px) grayscale(1); } }
    @keyframes shimmer { 0%, 55% { transform: translateX(-130%); } 100% { transform: translateX(130%); } }
    .phone-preview {
      display: block; position: absolute; z-index: 1; bottom: -1.1rem; inset-inline-end: -1rem; width: clamp(6.5rem, 14vw, 10rem);
      aspect-ratio: 9 / 17; overflow: hidden; border: 5px solid var(--text); border-radius: 1.35rem;
      background: var(--surface); box-shadow: var(--shadow); transition: transform .15s;
    }

    .phone-tile { display: block; padding-bottom: .4rem; }
    .phone-tile .work-art { border-radius: .45rem; aspect-ratio: 1; }
    .phone-tile small { display: block; color: var(--muted); font-size: .65rem; text-align: center; }
    .motion .phone-preview { animation: float 6s ease-in-out infinite alternate, slide-up .9s 1.6s both; }
    .motion .phone-feed { animation: feed-scroll 22s linear infinite; }
    @keyframes float { to { translate: 0 -14px; } }
    @keyframes feed-scroll { to { transform: translateY(-50%); } }
    .floating-labels { position: absolute; inset: 0; pointer-events: none; }
    .floating-labels span { position: absolute; z-index: 2; padding: .3rem .65rem; border-radius: 2rem; border: 1px solid var(--line); background: var(--surface); color: var(--accent); font-size: .85rem; font-weight: 800; box-shadow: var(--shadow); }
    .floating-labels span:nth-child(1) { top: 9%; inset-inline-start: -1rem; }
    .floating-labels span:nth-child(2) { top: 44%; inset-inline-end: -.8rem; animation-delay: -1.5s; }
    .floating-labels span:nth-child(3) { bottom: 15%; inset-inline-start: .15rem; animation-delay: -3s; }
    .motion .floating-labels span { animation-name: float; animation-duration: 4s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-direction: alternate; }
    .marquee { overflow: hidden; padding-block: .8rem; border-block-start: 1px solid var(--line); background: var(--surface); }
    .marquee-track { display: flex; width: max-content; white-space: nowrap; font-size: clamp(1.3rem, 3vw, 2.3rem); font-weight: 800; }
    .marquee-track:last-child { color: transparent; -webkit-text-stroke: 1px var(--accent); }
    .marquee-track span { display: inline-block; padding-inline: .8rem; }
    .marquee-track span:nth-child(even) { color: var(--accent); }
    .motion .marquee-track { will-change: transform; }
    .motion .reveal:not(.revealed, :focus-within) { opacity: 0; translate: 0 44px; }
    .motion .reveal { transition: opacity .9s, translate .9s cubic-bezier(.2,.8,.2,1); }
    .motion h2.reveal:not(.revealed) { transform: skewY(5deg); }
    .motion h2.reveal { transition: opacity .9s, translate .9s, transform .9s; }
    .work-content { display: block; }
    .motion .work.reveal { transition: opacity .4s, border-color .2s, box-shadow .2s, transform .2s; }
    .motion .work.reveal:not(.revealed, :focus-within) { translate: none; }
    .motion .work.reveal:is(.revealed, :focus-within) { transform: perspective(800px) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)); }

const byId = id => document.getElementById(id);

root.classList.toggle("motion", motionEnabled());
const storage = {

let language = storage.get("lang") === "en" ? "en" : "ar";

function renderTheme() {
  const control = byId("theme");
  const dark = theme === "dark";
  root.dataset.theme = theme;
  document.querySelector('meta[name="theme-color"]').content = dark ? "#1b1017" : "#fff8fa";

  control.setAttribute("aria-label", UI[language][dark ? "light" : "dark"]);
  control.title = control.getAttribute("aria-label");
}

function artwork(work, index, detail = false) {
  const img = work.img ? `<img src="${escapeHtml(work.img)}" alt="${detail ? escapeHtml(work.title[language]) : ''}" ${detail ? '' : 'loading="lazy"'}>` : "";
  return `<span class="work-art" data-tone="${index % 6}"><span class="art-mark" aria-hidden="true">${star}</span>${img}</span>`;
}

function renderGallery() {
  byId("gallery").innerHTML = SITE.works.map((work, index) =>
    `<button type="button" class="work reveal" data-project="${index}" data-category="${escapeHtml(work.cat)}" aria-haspopup="dialog">
      <span class="work-content">${artwork(work, index)}
      <span class="work-copy"><strong>${escapeHtml(work.title[language])}</strong><span class="category">${escapeHtml(categoryName(work.cat))}</span></span></span>
    </button>`
  ).join("");
  updateGallery(false);
}

function updateGallery(animate = motionEnabled()) {
  byId("gallery").querySelectorAll(".work").forEach(card => {
    const visible = filter === "all" || card.dataset.category === filter;
    card.disabled = !visible;
    if (visible) {
      card.classList.remove("leaving");
      card.hidden = false;
      observeReveal(card);
    } else if (animate && !card.hidden) {
      card.classList.add("leaving");
    } else {
      card.hidden = true;
    }
  });
}

function updateService() {
  byId("services").querySelectorAll("button").forEach(button =>
    button.setAttribute("aria-pressed", Number(button.dataset.service) === service)
  );
  byId("service-description").textContent = SITE.services[service][language][1];
}

function renderDecorations(name) {
  const projectItems = SITE.works.map((work, index) =>

  ).join("");
  byId("phone-name").textContent = name;
  byId("phone-feed").innerHTML = projectItems + projectItems;

  const marqueeItems = [...SITE.services.map(item => item[language][0]), ...SITE.cats.map(item => item[language]), SITE.title[language]];
  document.querySelectorAll(".marquee-track").forEach((track, index) => {
    const items = index ? [...marqueeItems].reverse() : marqueeItems;
    const row = items.map(item => `<span>${escapeHtml(item)}</span><span>✦</span>`).join("");
    track.innerHTML = `<div>${row.repeat(2)}</div><div>${row.repeat(2)}</div>`;

  byId("steps").innerHTML = SITE.steps.map((item, index) =>

  ).join("");

    `<article class="panel package${plan.hot ? ' featured' : ''}">
      <h3>${escapeHtml(plan.n[language])}</h3><div class="price">${escapeHtml(plan.p[language])}</div>
      <ul>${plan.f[language].map(feature => `<li>${escapeHtml(feature)}</li>`).join("")}</ul>
      <a class="button ${plan.hot ? 'primary' : ''}" target="_blank" rel="noopener" href="${escapeHtml(whatsapp(u.pkm + plan.n[language]))}">${u.pk}</a>

  byId("testimonials").innerHTML = SITE.reviews.map(review =>
    `<blockquote class="panel review"><p>“${escapeHtml(review.t[language])}”</p><footer><strong>${escapeHtml(review.n[language])}</strong><span>${escapeHtml(review.r[language])}</span></footer></blockquote>`
  ).join("");
  byId("channels").innerHTML = SITE.contact.map(([name, url]) =>

  ).join("") + `<a class="channel" href="mailto:${escapeHtml(SITE.email)}">${u.email}</a>`;
  byId("footer").textContent = `© ${new Date().getFullYear()} ${name} · ${u.rights}`;
  renderDecorations(name);
  document.querySelectorAll(".section h2, .section .panel, .about-avatar, .footer-mark").forEach(observeReveal);

function showProject() {
  const projects = visibleProjects();
  const { work, index } = projects[current];
  const missing = byId("project-missing");
  byId("project-category").textContent = categoryName(work.cat);
  byId("project-title").textContent = work.title[language];
  byId("project-description").textContent = work.desc[language];
  byId("project-art").innerHTML = artwork(work, index, true);
  missing.hidden = Boolean(work.img);
  byId("order").href = whatsapp(UI[language].ordm + work.title[language]);
  byId("position").textContent = `${current + 1} / ${projects.length}`;
  byId("previous").hidden = byId("next").hidden = projects.length < 2;
}

function stepProject(direction) {
  const count = visibleProjects().length;
  current = (current + direction + count) % count;
  showProject();
}

document.addEventListener("error", event => {
  const image = event.target;
  if (!(image instanceof HTMLImageElement)) return;
  if (image.id === "photo") byId("portrait").hidden = true;
  if (image.id === "about-photo") image.parentElement.hidden = true;
  if (byId("project-art").contains(image)) byId("project-missing").hidden = false;
  image.remove();
}, true);
byId("filters").addEventListener("click", event => {
  const button = event.target.closest("[data-filter]");
  if (!button) return;
  filter = button.dataset.filter;
  byId("filters").querySelectorAll("button").forEach(item => item.setAttribute("aria-pressed", item === button));
  updateGallery();
});
byId("gallery").addEventListener("animationend", event => {
  const card = event.target;
  if (event.animationName === "filter-out" && card.classList.contains("leaving")) {
    card.hidden = true;
    card.classList.remove("leaving");
  }
});
byId("services").addEventListener("click", event => {
  const button = event.target.closest("[data-service]");
  if (!button) return;
  service = Number(button.dataset.service);
  updateService();
  if (motionEnabled()) byId("service-description").animate(
    [{ opacity: 0, transform: "translateY(12px)" }, { opacity: 1, transform: "none" }],
    { duration: 450, easing: "ease" }
  );
});
byId("gallery").addEventListener("click", event => {
  const button = event.target.closest("[data-project]");
  if (!button || button.disabled) return;
  current = visibleProjects().findIndex(({ index }) => index === Number(button.dataset.project));
  showProject();

});
byId("close-project").addEventListener("click", () => dialog.close());
byId("previous").addEventListener("click", () => stepProject(-1));
byId("next").addEventListener("click", () => stepProject(1));
dialog.addEventListener("click", event => {
  if (event.target === dialog) dialog.close();
});
dialog.addEventListener("keydown", event => {
  if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
  event.preventDefault();
  const forward = language === "ar" ? "ArrowLeft" : "ArrowRight";
  stepProject(event.key === forward ? 1 : -1);
});
byId("lang").addEventListener("click", () => {
  language = language === "ar" ? "en" : "ar";
  storage.set("lang", language);
  render();
  updateNavigation();
});
byId("theme").addEventListener("click", () => {
  theme = theme === "dark" ? "light" : "dark";
  storage.set("theme", theme);
  renderTheme();
});
byId("message-form").addEventListener("submit", event => {
  event.preventDefault();
  const name = byId("sender").value.trim();
  const message = byId("message").value.trim();
  window.open(whatsapp(UI[language].subj + name + "\n" + message), "_blank", "noopener");
});

const sections = navLinks.map(link => byId(link.hash.slice(1)));
function updateNavigation() {
  const headerBottom = document.querySelector(".site-header").getBoundingClientRect().bottom;
  const lastSection = sections[sections.length - 1];
  const atBottom = Math.ceil(window.scrollY + window.innerHeight) >= root.scrollHeight;
  const active = atBottom ? lastSection :
    sections.findLast(section => section.getBoundingClientRect().top <= headerBottom + 64) ?? sections[0];
  navLinks.forEach(link => {
    if (link.hash === "#" + active.id) link.setAttribute("aria-current", "location");
    else link.removeAttribute("aria-current");
  });
  const currentLink = navLinks.find(link => link.hash === "#" + active.id);
  const nav = currentLink.parentElement;
  nav.style.setProperty("--indicator-left", currentLink.offsetLeft + "px");
  nav.style.setProperty("--indicator-width", currentLink.offsetWidth + "px");
}
window.addEventListener("scroll", updateNavigation, { passive: true });
window.addEventListener("resize", updateNavigation);

const revealObserver = new IntersectionObserver(entries => {
  entries.forEach(({ target, isIntersecting }) => {
    if (!isIntersecting) return;
    revealObserver.unobserve(target);
    target.classList.add("revealed");
    if (motionEnabled() && target.id === "stats") animateCounts(target);
  });
}, { threshold: .12 });

function observeReveal(element) {
  element.classList.add("reveal");
  if (!element.classList.contains("revealed")) revealObserver.observe(element);
}

function animateCounts(stats) {
  stats.querySelectorAll("[data-count]").forEach(element => {
    const count = Number(element.dataset.count);
    const start = performance.now();
    const tick = time => {
      const progress = motionEnabled() ? Math.min(1, (time - start) / 1250) : 1;
      element.textContent = Math.round(count * progress) + "+";
      if (progress < 1 && element.isConnected) requestAnimationFrame(tick);
    };
    element.textContent = "0+";
    requestAnimationFrame(tick);
  });
}

const heroGrid = document.querySelector(".hero-grid");
const orbs = document.querySelectorAll(".hero-orb");
const marquee = document.querySelector(".marquee");
const marqueeTracks = [...marquee.querySelectorAll(".marquee-track")];
const marqueeOffsets = [0, 0];
let lastScroll = scrollY;
let velocity = 0;
let marqueeHovered = false;
let marqueeVisible = false;
let marqueeFrame = 0;
const marqueeObserver = new IntersectionObserver(([entry]) => {
  marqueeVisible = entry.isIntersecting;
  if (marqueeVisible && motionEnabled() && !marqueeFrame) marqueeFrame = requestAnimationFrame(animateMarquee);
});
marqueeObserver.observe(marquee);
marquee.addEventListener("pointerenter", () => marqueeHovered = true);
marquee.addEventListener("pointerleave", () => marqueeHovered = false);

function updateScrollEffects() {
  const scrollable = root.scrollHeight - innerHeight;
  root.style.setProperty("--progress", scrollable > 0 ? scrollY / scrollable : 0);
  const heroTravel = Math.min(scrollY, heroGrid.offsetHeight);
  heroGrid.style.transform = motionEnabled() ? `translateY(${heroTravel * .1}px)` : "";
  orbs.forEach((orb, index) => orb.style.transform = motionEnabled() ?
    `translateY(${heroTravel * (index ? -.18 : .22)}px)` : "");
  const bio = byId("bio");
  const words = bio.querySelectorAll(".bio-word");
  const progress = (innerHeight * .95 - bio.getBoundingClientRect().top) / (innerHeight * .4);
  words.forEach((word, index) => word.classList.toggle("lit", motionEnabled() && index < progress * words.length));
}

function animateMarquee() {
  if (!motionEnabled() || !marqueeVisible) {
    marqueeFrame = 0;
    return;
  }
  velocity += (scrollY - lastScroll - velocity) * .12;
  lastScroll = scrollY;
  const direction = velocity < -1 ? -1 : 1;
  const speed = (.8 + Math.min(Math.abs(velocity), 40) * .35) * (marqueeHovered ? .15 : 1);
  marqueeTracks.forEach((track, index) => {
    const width = track.firstElementChild.offsetWidth;
    if (!width) return;
    const offset = marqueeOffsets[index] + (index ? -1 : 1) * direction * speed;
    marqueeOffsets[index] = ((offset % width) + width) % width;
    track.style.transform = `translateX(${language === "ar" ? marqueeOffsets[index] : -marqueeOffsets[index]}px)`;
  });
  marqueeFrame = requestAnimationFrame(animateMarquee);
}

function startLoader() {
  const loader = byId("preloader");
  if (!motionEnabled()) {
    loader.hidden = true;
    return;
  }
  const start = performance.now();
  const tick = time => {
    const completion = Math.min(1, (time - start) / 1350);
    byId("loader-number").textContent = Math.round(completion * 100) + "%";
    if (completion < 1) requestAnimationFrame(tick);
    else loader.classList.add("done");
  };
  requestAnimationFrame(tick);
}

const ring = byId("cursor-ring");
const dot = byId("cursor-dot");
const glow = byId("pointer-glow");
const phone = byId("phone-preview");
let pointerX = 0;
let pointerY = 0;
let ringX = 0;
let ringY = 0;
let cursorFrame = 0;
let magneticButton;
let tiltedCard;

function animateCursor() {
  ringX += (pointerX - ringX) * .16;
  ringY += (pointerY - ringY) * .16;
  ring.style.transform = `translate3d(${ringX}px,${ringY}px,0)`;
  cursorFrame = requestAnimationFrame(animateCursor);
}

function resetPointer() {
  root.classList.remove("pointer-active");
  cancelAnimationFrame(cursorFrame);
  if (magneticButton) magneticButton.style.translate = "";
  if (tiltedCard) {
    tiltedCard.style.removeProperty("--tilt-x");
    tiltedCard.style.removeProperty("--tilt-y");
  }
  phone.style.transform = "";
  magneticButton = tiltedCard = null;
  root.style.removeProperty("--hero-x");
  root.style.removeProperty("--hero-y");
}

window.addEventListener("pointermove", event => {
  if (!motionEnabled() || !finePointer.matches || event.pointerType !== "mouse" || dialog.open) return;
  pointerX = event.clientX;
  pointerY = event.clientY;
  if (!root.classList.contains("pointer-active")) {
    root.classList.add("pointer-active");
    ringX = pointerX;
    ringY = pointerY;
    animateCursor();
  }
  dot.style.transform = glow.style.transform = `translate3d(${pointerX}px,${pointerY}px,0)`;
  const control = event.target.closest("a, button, input, textarea");
  const textField = control?.matches("input, textarea") ?? false;
  const work = control?.matches(".work") ?? false;
  ring.classList.toggle("over-control", Boolean(control) && !textField && !work);
  ring.classList.toggle("over-work", work);
  ring.classList.toggle("is-text", textField);
  dot.classList.toggle("is-text", textField);
  ring.textContent = work ? (language === "ar" ? "افتح" : "View") : "";
  root.style.setProperty("--hero-x", ((pointerX / innerWidth - .5) * 16) + "px");
  root.style.setProperty("--hero-y", ((pointerY / innerHeight - .5) * 10) + "px");
  root.style.setProperty("--shine-x", (pointerX / innerWidth * 100) + "%");

  const panel = event.target.closest(".panel");
  if (panel) {
    const rect = panel.getBoundingClientRect();
    panel.style.setProperty("--point-x", (pointerX - rect.left) + "px");
    panel.style.setProperty("--point-y", (pointerY - rect.top) + "px");
  }
  const button = event.target.closest(".button, .control");
  if (magneticButton && magneticButton !== button) magneticButton.style.translate = "";
  magneticButton = button;
  if (button) {
    const rect = button.getBoundingClientRect();
    button.style.translate = `${(pointerX - rect.left - rect.width / 2) * .28}px ${(pointerY - rect.top - rect.height / 2) * .4}px`;
  }

  const card = event.target.closest(".work");
  if (tiltedCard && tiltedCard !== card) {
    tiltedCard.style.removeProperty("--tilt-x");
    tiltedCard.style.removeProperty("--tilt-y");
  }
  tiltedCard = card;
  if (card) {
    const rect = card.getBoundingClientRect();
    card.style.setProperty("--tilt-x", `${-((pointerY - rect.top) / rect.height - .5) * 10}deg`);
    card.style.setProperty("--tilt-y", `${((pointerX - rect.left) / rect.width - .5) * 10}deg`);
  }
  const visual = event.target.closest("#hero-visual");
  if (visual) {
    const rect = visual.getBoundingClientRect();
    phone.style.transform = `rotateY(${((pointerX - rect.left) / rect.width - .5) * 22}deg) rotateX(${-((pointerY - rect.top) / rect.height - .5) * 16}deg)`;
  } else {
    phone.style.transform = "";
  }
}, { passive: true });
root.addEventListener("pointerleave", resetPointer);
window.addEventListener("blur", resetPointer);
window.addEventListener("keydown", resetPointer);
window.addEventListener("pointerdown", () => ring.classList.add("pressed"));
window.addEventListener("pointerup", () => ring.classList.remove("pressed"));
motionPreference.addEventListener("change", () => {
  root.classList.toggle("motion", motionEnabled());
  if (motionEnabled()) {
    if (marqueeVisible && !marqueeFrame) marqueeFrame = requestAnimationFrame(animateMarquee);
  } else {
    resetPointer();
    marqueeTracks.forEach(track => track.style.transform = "");
  }
  updateGallery(false);
  updateNavigation();
  updateScrollEffects();
});
window.addEventListener("scroll", updateScrollEffects, { passive: true });
window.addEventListener("resize", updateScrollEffects);

const typing = byId("contact-typing");
const typingObserver = new IntersectionObserver(([entry]) => {
  if (!entry.isIntersecting) return;
  typingObserver.disconnect();
  if (!motionEnabled()) return;
  typing.classList.add("active");
  setTimeout(() => typing.classList.remove("active"), 1300);
});
typingObserver.observe(byId("contact"));

byId("photo").src = SITE.photo;
byId("about-photo").src = SITE.photo;
render();
updateNavigation();
updateScrollEffects();
startLoader();
document.fonts.ready.then(updateNavigation);
  </script>
