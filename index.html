<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahmed El-Nablawy</title>
<meta name="description" content="Ahmed El-Nablawy — Graphic Designer | أحمد النبلاوي مصمم جرافيك">
<meta property="og:title" content="أحمد النبلاوي | Ahmed El-Nablawy — Graphic Designer">
<meta property="og:description" content="تصميمات سوشيال ميديا بتخلّي الناس توقف السكرول عند بوستك.">
<meta property="og:type" content="website"><meta property="og:image" content="images/work1.jpg">
<meta name="theme-color" content="#050d1f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ===== الألوان والخطوط: عدّل من هنا فقط | Colors & fonts ===== */
:root{--b1:#0b3d91;--b2:#2563ff;--b3:#22d3ee;--grad:linear-gradient(135deg,var(--b1),var(--b2) 50%,var(--b3));
--bg:#f3f7ff;--fg:#0a1b3d;--card:rgba(255,255,255,.8);--muted:#546690;--line:rgba(37,99,255,.18);--d:-1;
--ar:'Cairo',Tahoma,sans-serif;--en:'Inter','Segoe UI',sans-serif;--font:var(--ar)}
:root[data-theme=dark]{--bg:#050d1f;--fg:#eaf1ff;--card:rgba(16,32,74,.6);--muted:#93a6d1;--line:rgba(80,140,255,.24)}
:root[lang=en]{--font:var(--en);--d:1}
/* ============================================================= */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--fg);line-height:1.8;overflow-x:hidden;transition:background .5s,color .5s}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}button{font-family:inherit}
.wrap{max-width:1080px;margin:auto;padding:0 22px}
section{padding:96px 0;position:relative}
h2{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;margin-bottom:30px}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.glass{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(12px);border-radius:22px}
#pre{position:fixed;inset:0;z-index:999;background:#050d1f;display:flex;align-items:center;justify-content:center;transition:opacity .6s,visibility .6s}
#pre.go{opacity:0;visibility:hidden}
#pre .st{width:min(300px,70vw);height:4px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
#pre .st::after{content:"";display:block;height:100%;background:var(--grad);animation:ld 1.1s linear forwards}
@keyframes ld{from{width:0}to{width:100%}}
#bar{position:fixed;top:0;inset-inline-start:0;height:3px;width:0;background:var(--grad);z-index:100}
#glow{position:fixed;width:460px;height:460px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(34,211,238,.16),transparent 65%);transform:translate(-50%,-50%);left:-999px;z-index:0}
nav{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:60px;max-width:94vw}
nav a.l{padding:7px 16px;border-radius:50px;font-weight:600;font-size:.92rem;transition:.3s}
nav a.l{position:relative}nav a.l:hover{color:var(--b2)}nav a.l.on{color:#fff}
.ib{background:none;border:1px solid var(--line);color:var(--fg);min-width:36px;height:36px;border-radius:50px;cursor:pointer;font-weight:600;padding:0 11px;transition:.3s}
.ib:hover{border-color:var(--b2);transform:scale(1.08)}
.hero{min-height:100vh;display:flex;align-items:center;position:relative;overflow:hidden;padding:100px 0 60px}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.45;animation:fl 14s ease-in-out infinite alternate}
.b1{width:460px;height:460px;background:var(--b2);top:0;inset-inline-start:-80px}
.b2{width:380px;height:380px;background:var(--b3);bottom:-60px;inset-inline-end:0;animation-delay:-6s}
@keyframes fl{to{translate:40px -50px;scale:1.2}}
.hg{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;position:relative;z-index:1}
.tag{display:inline-block;padding:6px 18px;border-radius:50px;font-weight:600;color:var(--b2);margin-bottom:16px}
.hero h1{font-size:clamp(2.6rem,7.5vw,5.2rem);font-weight:800;line-height:1.15;margin-bottom:14px}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:.14em .06em .26em;margin:-.14em -.06em -.26em;translate:calc(var(--tx,0px)*var(--k,1)) calc(var(--ty,0px)*var(--k,1));transition:translate .35s cubic-bezier(.2,.8,.2,1)}
.w>span{display:inline-block;transform:translateY(140%) skewY(7deg);opacity:0;filter:blur(8px);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{transform:none;opacity:1;filter:none}}
.hero p.d{color:var(--muted);max-width:480px;font-size:1.08rem;margin-bottom:28px}
.fu{opacity:0;transform:translateY(22px);animation:up .8s 1.8s forwards}
@keyframes up{to{opacity:1;transform:none}}
.btn{display:inline-block;padding:13px 30px;border-radius:50px;font-weight:600;border:2px solid var(--b2);background:none;color:var(--fg);cursor:pointer;font-size:1rem;margin-inline-end:10px;transition:box-shadow .3s,background .3s}
.btn.fill{background:var(--grad);background-size:200%;border-color:transparent;color:#fff}
.btn.fill:hover{background-position:100%;box-shadow:0 12px 30px rgba(37,99,255,.45)}
.btn:not(.fill):hover{background:var(--b2);color:#fff}
.ph-wrap{perspective:1000px;display:flex;justify-content:center;position:relative}
.phone{width:285px;aspect-ratio:9/18.5;border-radius:44px;border:9px solid #0d1830;background:var(--bg);overflow:hidden;position:relative;box-shadow:0 40px 80px rgba(37,99,255,.35);transition:transform .15s;animation:bob 6s ease-in-out infinite alternate;opacity:0;animation:bob 6s ease-in-out infinite alternate,up .9s 1.6s forwards}
@keyframes bob{to{translate:0 -14px}}
.phone .top{display:flex;align-items:center;gap:8px;padding:14px 14px 8px;font-weight:700;font-size:.8rem;position:relative;z-index:2;background:var(--bg)}
.av{border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;position:relative;overflow:hidden;flex:none}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feed{animation:scr 22s linear infinite;padding:0 10px}
@keyframes scr{to{transform:translateY(-50%)}}
.fp{margin-bottom:12px}
.fp .im{aspect-ratio:1;border-radius:14px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.85rem;text-align:center;padding:8px;position:relative;overflow:hidden}
.fp .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fp small{display:block;padding:4px 4px 0;font-size:.7rem;color:var(--muted)}
.fb{position:absolute;padding:8px 16px;border-radius:50px;font-weight:700;font-size:.85rem;animation:bob 4s ease-in-out infinite alternate;z-index:3}
.fb:nth-of-type(1){top:12%;inset-inline-start:-4%}.fb:nth-of-type(2){top:46%;inset-inline-end:-6%;animation-delay:-1.5s}.fb:nth-of-type(3){bottom:12%;inset-inline-start:2%;animation-delay:-3s}
.rv{opacity:0;transform:translateY(44px);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.prof{padding:34px;display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center}
.ring{width:150px;height:150px;border-radius:50%;padding:5px;background:conic-gradient(var(--b1),var(--b2),var(--b3),var(--b1));animation:sp 6s linear infinite;display:flex}
@keyframes sp{to{transform:rotate(360deg)}}
.ring .av{width:100%;height:100%;font-size:3rem;border:4px solid var(--bg);animation:sp 6s linear infinite reverse}
.prof h3{font-size:1.5rem}
.nums{display:flex;gap:30px;margin:12px 0}
.nums div{text-align:center}.nums b{display:block;font-size:1.6rem;line-height:1.2}
.nums span{font-size:.85rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{padding:4px 16px;border-radius:50px;font-size:.85rem;font-weight:600}
.hl{display:flex;gap:22px;margin:30px 0 14px;overflow-x:auto;padding:6px 4px}
.hl button{background:none;border:0;color:var(--fg);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:.85rem;min-width:84px;transition:transform .3s}
.hl button:hover{transform:translateY(-4px)}
.hl i{width:72px;height:72px;border-radius:50%;font-style:normal;font-size:1.9rem;display:flex;align-items:center;justify-content:center;border:3px solid transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,var(--grad) border-box;transition:.3s}
.hl button.on i{background:var(--grad);transform:scale(1.1)}
#hlt{padding:20px 26px;min-height:90px}
#hlt.sw{animation:sw .45s}
@keyframes sw{from{opacity:0;transform:translateY(12px)}}
.tabs{display:flex;justify-content:center;gap:6px;border-top:1px solid var(--line);margin-bottom:6px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-top:2px solid transparent;color:var(--muted);padding:12px 20px;font-weight:600;cursor:pointer;margin-top:-1px;transition:.3s}
.tabs button.on,.tabs button:hover{color:var(--b2);border-top-color:var(--b2)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.card{position:relative;aspect-ratio:1;overflow:hidden;cursor:pointer;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;text-align:center;padding:12px;transition:opacity .4s,scale .4s;transform:perspective(800px) rotateX(var(--rx,0)) rotateY(var(--ry,0))}
.card.hide{opacity:0;scale:.85}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s}
.card:hover img{transform:scale(1.1)}
.ov{position:absolute;inset:0;background:linear-gradient(rgba(11,61,145,.75),rgba(5,13,31,.9));display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:.35s;padding:10px}
.card:hover .ov{opacity:1}.ov small{color:var(--b3)}
#lb{position:fixed;inset:0;background:rgba(3,8,22,.9);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s;padding:16px}
#lb.open{opacity:1;pointer-events:auto}
.post{display:grid;grid-template-columns:1.2fr 1fr;width:min(900px,100%);max-height:88vh;border-radius:22px;overflow:hidden;background:var(--bg);transform:scale(.9) translateY(24px);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#lb.open .post{transform:none}
.pm{position:relative;background:var(--grad);min-height:320px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:1.6rem;text-align:center;padding:20px;cursor:pointer}
.pm img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#050d1f}
.pc{padding:22px;display:flex;flex-direction:column;gap:14px}
.pc header{display:flex;align-items:center;gap:10px;font-weight:700}
.act{margin-top:auto;display:flex;gap:10px;align-items:center}
#like{background:none;border:0;font-size:1.8rem;cursor:pointer;transition:transform .2s;color:var(--muted)}
#like.on{color:#ff3b6b;animation:pop .45s}
@keyframes pop{40%{transform:scale(1.5)}}
.big{position:absolute;font-size:5rem;pointer-events:none;animation:bg .8s forwards;z-index:3}
@keyframes bg{from{transform:scale(.2);opacity:1}60%{transform:scale(1.2)}to{transform:scale(1.5) translateY(-40px);opacity:0}}
.lbb{position:absolute;background:rgba(255,255,255,.12);border:0;color:#fff;width:44px;height:44px;border-radius:50%;font-size:1.4rem;cursor:pointer;transition:.3s;z-index:5}
.lbb:hover{background:var(--b2)}
#lbx{top:16px;inset-inline-end:18px}#lbp{top:50%;left:12px}#lbn{top:50%;right:12px}
.dm{max-width:640px;margin:auto;padding:24px}
.bub{max-width:82%;padding:12px 18px;border-radius:20px;margin-bottom:10px}
.bub.me{background:var(--grad);color:#fff;border-end-start-radius:4px}
.typing{display:inline-flex;gap:4px;padding:14px 18px;border-radius:20px;background:var(--line);margin-bottom:10px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:ty 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{50%{transform:translateY(-6px);opacity:.4}}
.qr{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.qr a{padding:8px 18px;border-radius:50px;border:1px solid var(--b2);font-weight:600;font-size:.9rem;transition:.3s}
.qr a:hover{background:var(--grad);color:#fff;border-color:transparent;transform:translateY(-3px)}
form{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.row{display:flex;gap:10px}
input,textarea{font-family:inherit;font-size:1rem;padding:13px 18px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--fg);transition:.3s;flex:1}
input:focus,textarea:focus{outline:0;border-color:var(--b2);box-shadow:0 0 0 4px rgba(37,99,255,.2)}
footer{text-align:center;padding:30px;color:var(--muted);border-top:1px solid var(--line)}
.g3,.g4{display:grid;gap:18px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.rc,.stc,.pkc{padding:26px}.rc p{margin-bottom:14px}.rc small{display:block;color:var(--muted)}
.stc i{display:flex;width:42px;height:42px;border-radius:50%;background:var(--grad);color:#fff;font-style:normal;font-weight:800;align-items:center;justify-content:center;margin-bottom:12px}.stc p{color:var(--muted);font-size:.92rem}
.pkc{display:flex;flex-direction:column;gap:12px}.pkc.hot{border-color:var(--b2);box-shadow:0 20px 50px rgba(37,99,255,.25)}.pkc .pr{font-size:1.5rem;font-weight:800}.pkc ul{list-style:none;flex:1}.pkc li{padding:4px 0;color:var(--muted)}.pkc li::before{content:"✓ ";color:var(--b3);font-weight:800}.pkc .btn{text-align:center;margin:0}
.wab{position:fixed;bottom:20px;inset-inline-end:20px;z-index:95;width:56px;height:56px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;font-size:1.6rem;box-shadow:0 10px 26px rgba(37,211,102,.5);transition:transform .3s}.wab:hover{transform:scale(1.1)}
html.cx,html.cx *{cursor:none!important}html.cx input,html.cx textarea{cursor:text!important}
#cr,#cd{position:fixed;top:0;left:0;pointer-events:none;z-index:1000;border-radius:50%;opacity:0;transition:opacity .3s}
#cd{width:8px;height:8px;margin:-4px 0 0 -4px;background:var(--b3);box-shadow:0 0 12px var(--b3)}
#cr{width:38px;height:38px;margin:-19px 0 0 -19px;border:1.5px solid var(--b2);display:flex;align-items:center;justify-content:center;transition:opacity .3s,width .35s cubic-bezier(.2,.8,.2,1),height .35s cubic-bezier(.2,.8,.2,1),margin .35s cubic-bezier(.2,.8,.2,1),background .3s,border-color .3s}
#cr span{font-size:.8rem;font-weight:700;color:#fff;opacity:0;transition:opacity .2s}
#cr.on,#cd.on{opacity:1}
#cr.h{width:60px;height:60px;margin:-30px 0 0 -30px;background:rgba(37,99,255,.15);border-color:var(--b3)}
#cr.v{width:86px;height:86px;margin:-43px 0 0 -43px;background:var(--grad);border-color:transparent}#cr.v span{opacity:1}
#cr.d{width:28px;height:28px;margin:-14px 0 0 -14px}
#cr.x,#cd.x{opacity:0}
/* --- animations v2 --- */
#pre.go{opacity:1;transform:translateY(-100%);visibility:hidden;transition:transform .9s cubic-bezier(.77,0,.18,1),visibility 0s .9s}
.pc2{text-align:center;width:min(300px,70vw);color:#eaf1ff}
#pn{display:block;font-size:4.2rem;font-weight:800;line-height:1.2;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#pl{display:block;margin-bottom:18px;opacity:.7}
.mq{overflow:hidden;padding:24px 0;border-block:1px solid var(--line);position:relative;z-index:1;background:var(--bg)}
.mt{display:flex;width:max-content;will-change:transform;font-size:clamp(1.6rem,4vw,3rem);font-weight:800;white-space:nowrap}
.mt.rev{color:transparent;-webkit-text-stroke:1.5px var(--b2);margin-top:6px}
.mt span{padding:0 22px}.mt:not(.rev) span:nth-child(even){color:var(--b3)}
.mark{overflow:hidden;font-size:clamp(2.4rem,9vw,8rem);font-weight:800;line-height:1.25;text-align:center;white-space:nowrap;padding:10px 0 0}
.mark .mw{display:inline-block;transform:translateY(110%);transition:transform 1.1s cubic-bezier(.2,.8,.2,1) calc(var(--i)*.15s);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.mark.in .mw{transform:none}
h2.rv{transform:translateY(60px) skewY(5deg);transform-origin:right bottom}
.card.rv{clip-path:inset(100% 0 0 0);transition:clip-path 1s cubic-bezier(.77,0,.18,1),opacity .4s,scale .4s}
.card.rv.in{clip-path:inset(0)}.card.rv:not(.in) img{transform:scale(1.3)}
.btn{transition:box-shadow .3s,background .3s,transform .25s cubic-bezier(.2,.8,.2,1)}
.rc.in:hover,.pkc.in:hover,.stc.in:hover{transform:translateY(-8px);box-shadow:0 24px 50px rgba(37,99,255,.22)}
#np{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:50px;background:var(--grad);z-index:-1;pointer-events:none;transition:transform .5s cubic-bezier(.2,.8,.2,1),width .5s cubic-bezier(.2,.8,.2,1)}
.sw{color:var(--fg);opacity:.2;transition:opacity .3s}.sw.on{opacity:1}
.pkc,.rc,.stc,.prof{background-image:radial-gradient(320px circle at var(--mx,-999px) var(--my,-999px),rgba(34,211,238,.16),transparent 70%)}
.hero h1{position:relative}
.hero h1::after{content:"";position:absolute;inset-inline-start:0;bottom:-8px;height:4px;width:0;border-radius:4px;background:var(--grad);box-shadow:0 0 18px var(--b3);animation:ul 1s 2.5s cubic-bezier(.7,0,.2,1) forwards}
@keyframes ul{to{width:clamp(80px,14vw,150px)}}
.hero h1 .gt{background-size:200% 100%;background-position:var(--gx,0%) 0}
/* --- صورتك فوق الاسم --- */
.hp{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.hr{width:clamp(130px,15vw,180px);height:clamp(130px,15vw,180px);flex:none;border-radius:50%;padding:4px;background:conic-gradient(var(--b1),var(--b2),var(--b3),var(--b1));opacity:0;scale:.4;filter:drop-shadow(0 0 20px rgba(34,211,238,.35));animation:hpin 1s 1.5s cubic-bezier(.2,.8,.2,1) forwards,sp 6s linear infinite,hb 5s 2.6s ease-in-out infinite alternate}
@keyframes hpin{to{opacity:1;scale:1}}@keyframes hb{to{translate:0 -7px}}
.hi{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;border:3px solid var(--bg);background:var(--grad);animation:sp 6s linear infinite reverse}
.hi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 24%;transform:translate(calc(var(--tx,0px)*-1.3),calc(var(--ty,0px)*-1.3)) scale(1.12);transition:transform .3s ease-out,scale .6s cubic-bezier(.2,.8,.2,1);animation:phr 1.5s 1.6s cubic-bezier(.2,.8,.2,1) both}
.hr:hover .hi img{scale:1.08}
.hi::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.38) 50%,transparent 62%);transform:translateX(-130%);animation:shn 5.5s 3s ease-in-out infinite}
.hs{display:flex;align-items:center;gap:9px;padding:7px 16px;border-radius:50px;font-weight:600;font-size:.85rem}
.hs::before{content:"";width:9px;height:9px;border-radius:50%;background:#34d399;flex:none;animation:pls 2s infinite}
@keyframes pls{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}70%,100%{box-shadow:0 0 0 10px rgba(52,211,153,0)}}
@media(max-width:820px){.hp{justify-content:center}}
/* --- صورتك --- */
.av img{object-position:50% 26%}
.ring{filter:drop-shadow(0 0 22px rgba(34,211,238,.3))}
.ring .av img{transform:translate(calc(var(--tx,0px)*-1.3),calc(var(--ty,0px)*-1.3)) scale(1.12);transition:transform .3s ease-out,scale .6s cubic-bezier(.2,.8,.2,1)}
.ring:hover .av img{scale:1.07}
.prof.in .ring .av img{animation:phr 1.5s cubic-bezier(.2,.8,.2,1) both}
@keyframes phr{from{opacity:0;scale:1.6;filter:blur(14px) grayscale(1)}}
.ring .av::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.38) 50%,transparent 62%);transform:translateX(-130%);animation:shn 5.5s 2.2s ease-in-out infinite}

@media(max-width:820px){.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}}

    { ar:["ابعتلي فكرتك","احكيلي عن البراند واللي محتاجه."], en:["Send your idea","Tell me about your brand and needs."] },
    { ar:["مسودة أولى","بجهزلك أول تصميم ترشيحي."], en:["First draft","I prepare the first concept."] },
    { ar:["تعديلات","بعدّل لحد ما يعجبك."], en:["Revisions","I refine it until you love it."] },
    { ar:["تسليم","بسلّمك الملفات جاهزة للنشر."], en:["Delivery","Files ready to publish."] }
  ],
  reviews: [
    { t:{ar:"شغل منظم وسريع، والتصميمات زوّدت التفاعل على صفحتنا.",en:"Organized, fast work. The designs boosted our page engagement."}, n:{ar:"اسم العميل",en:"Client name"}, r:{ar:"صاحب مطعم",en:"Restaurant owner"} },
    { t:{ar:"فهم هويتنا من أول مرة وسلّم في الميعاد.",en:"Got our identity right the first time and delivered on schedule."}, n:{ar:"اسم العميل",en:"Client name"}, r:{ar:"براند ملابس",en:"Fashion brand"} },
    { t:{ar:"تعامل راقي وتعديلات من غير أي تعقيد.",en:"Great to work with, smooth revisions."}, n:{ar:"اسم العميل",en:"Client name"}, r:{ar:"متجر أونلاين",en:"Online store"} }
  ]
};
/* نصوص الواجهة | Interface labels */
const UI = {
  ar: { n0:"الرئيسية", n1:"عني", n2:"أعمالي", n4:"تواصل", b1:"شوف أعمالي", b2:"ابعتلي رسالة", b3:"إرسال",
        h1:"مين أحمد؟", h2:"أعمالي", h4:"ابعتلي رسالة", all:"الكل", p1:"اسمك", p2:"اكتب رسالتك هنا...",
        s:["سنين خبرة","مشروع","عميل"], rights:"جميع الحقوق محفوظة", subj:"رسالة من ", av:"متاح للمشاريع", h5:"آراء العملاء", h6:"الباقات", h7:"إزاي بنشتغل", ord:"اطلب تصميم زي ده", vw:"افتح", pk:"اطلب الباقة", pkm:"أهلاً، عايز أطلب باقة: ", ordm:"أهلاً، عايز تصميم زي: ",
        hi:"أهلاً! 👋 احكيلي عن فكرتك أو اختار طريقة التواصل اللي تريحك." },
  en: { n0:"Home", n1:"About", n2:"Work", n4:"Contact", b1:"View my work", b2:"Send me a message", b3:"Send",
        h1:"Who is Ahmed?", h2:"My Work", h4:"Send a Message", all:"All", p1:"Your name", p2:"Write your message...",
        s:["Years","Projects","Clients"], rights:"All rights reserved", subj:"Message from ", av:"Available for work", h5:"Client Reviews", h6:"Packages", h7:"How We Work", ord:"Order a similar design", vw:"View", pk:"Choose plan", pkm:"Hi, I'd like the package: ", ordm:"Hi, I'd like a design like: ",
        hi:"Hi there! 👋 Tell me about your idea, or pick the way you'd like to reach me." }
};
/* ================== نهاية الجزء القابل للتعديل | End of editable part ================== */

const $ = id => document.getElementById(id), root = document.documentElement;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = { get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }, set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} } };
let lang = store.get('lang') || 'ar', cat = 'all', cur = 0, vis = [], hlI = 0, liked = {};

const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.classList.add('in');
  e.target.querySelectorAll('[data-n]').forEach(el => { const n = +el.dataset.n, st = Math.max(1, Math.ceil(n/45)); let v = 0;
    const t = setInterval(() => { v = Math.min(n, v+st); el.textContent = v + '+'; if (v >= n) clearInterval(t); }, 30); });
  if (e.target.querySelector('#ty')) setTimeout(() => { $('ty').style.display = 'none'; $('msg').style.display = 'block'; }, 1300);
  io.unobserve(e.target);
}), { threshold: .2 });
const watch = () => document.querySelectorAll('.rv:not(.in)').forEach(el => io.observe(el));
const avatar = (el) => el.innerHTML = `<span>${esc(SITE.name[lang].charAt(0))}</span><img src="${esc(SITE.photo)}" alt="" onerror="this.remove()">`;
const wa = t => SITE.contact[0][1] + (t ? "?text=" + encodeURIComponent(t) : "");
const catName = k => SITE.cats.find(c => c.key === k)[lang];

function render() {
  const u = UI[lang], N = SITE.name[lang];
  root.lang = lang; root.dir = lang === 'ar' ? 'rtl' : 'ltr';
  $('lang').textContent = lang === 'ar' ? 'EN' : 'عربي';
  document.title = N + ' | ' + SITE.title[lang];
  document.querySelectorAll('[data-i]').forEach(el => el.textContent = u[el.dataset.i]);
  document.querySelectorAll('[data-p]').forEach(el => el.placeholder = u[el.dataset.p]);
  $('hTitle').textContent = SITE.title[lang];
  $('hName').innerHTML = N.split(' ').map((w,i) => `<span class="w" style="--k:${1+i*.9}"><span style="animation-delay:${1.5+i*.14}s" class="${i ? 'gt' : ''}">${esc(w)}</span></span>`).join(' ');
  $('hTag').textContent = SITE.tagline[lang];
  [$('pav'), $('bigav'), $('lav')].forEach(avatar); $('hph').src = SITE.photo; $('hph').alt = SITE.name[lang];
  $('pnm').textContent = N; $('pn2').textContent = N; $('lnm').textContent = N; $('pt2').textContent = SITE.title[lang];
  ['f1','f2','f3'].forEach((id,i) => $(id).textContent = ['❤ ', '✦ ', '💬 '][i] + SITE.cats[i][lang]);
  const fp = SITE.works.map(w => `<div class="fp"><div class="im">${esc(w.title[lang])}<img src="${esc(w.img)}" alt="" onerror="this.remove()"></div><small>${esc(catName(w.cat))}</small></div>`).join('');
  $('feed').innerHTML = fp + fp;
  $('nums').innerHTML = [SITE.projects, SITE.clients, SITE.years].map((n,i) => `<div><b class="gt" data-n="${n}">0</b><span>${[u.s[1],u.s[2],u.s[0]][i]}</span></div>`).join('');
  $('tools').innerHTML = SITE.tools.map(t => `<span class="chip glass">${esc(t)}</span>`).join('');
  $('bio').innerHTML = SITE.bio[lang].split(' ').map(w => `<span class="sw">${esc(w)}</span>`).join(' ');
  $('hl').innerHTML = SITE.services.map((s,i) => `<button class="${i===hlI?'on':''}" data-k="${i}"><i>${s.icon}</i>${esc(s[lang][0])}</button>`).join('');
  showHl(false);
  $('tabs').innerHTML = [{key:'all',[lang]:u.all}, ...SITE.cats].map(c => `<button class="${c.key===cat?'on':''}" data-c="${c.key}">${esc(c[lang])}</button>`).join('');
  $('grid').innerHTML = SITE.works.map((w,i) => `<div class="card rv" data-idx="${i}" data-cat="${w.cat}" style="transition-delay:${(i%3)*90}ms${cat!=='all'&&w.cat!==cat?';display:none':''}">
    <span>${esc(w.title[lang])}</span><img src="${esc(w.img)}" alt="${esc(w.title[lang])}" loading="lazy" onerror="this.remove()">
    <div class="ov"><b>${esc(w.title[lang])}</b><small>${esc(catName(w.cat))}</small></div></div>`).join('');
  $('msg').textContent = u.hi;
  $('qr').innerHTML = SITE.contact.map(c => `<a href="${esc(c[1])}" target="_blank" rel="noopener">${esc(c[0])}</a>`).join('') + `<a href="mailto:${esc(SITE.email)}">Email</a>`;
  $('foot').textContent = '© ' + new Date().getFullYear() + ' ' + N + ' — ' + u.rights;
  const mw = [...SITE.services.map(x => x[lang][0]), ...SITE.cats.map(c => c[lang]), SITE.title[lang]];
  const mrow = a => a.map(x => `<span>${esc(x)}</span><span>✦</span>`).join('').repeat(4);
  $('mq1').innerHTML = mrow(mw); $('mq2').innerHTML = mrow([...mw].reverse());
  $('pl').textContent = N;
  $('mark').innerHTML = N.split(' ').map((w, i) => `<span class="mw" style="--i:${i}">${esc(w)}</span>`).join(' ');
  $('wa').href = wa('');
  bioP(); setTimeout(() => dispatchEvent(new Event('scroll')), 60);
  $('st').innerHTML = SITE.steps.map((x,i) => `<div class="glass rv stc"><i>${i+1}</i><b>${esc(x[lang][0])}</b><p>${esc(x[lang][1])}</p></div>`).join('');
  $('pk').innerHTML = SITE.packages.map(p => `<div class="glass rv pkc${p.hot?' hot':''}"><h3>${esc(p.n[lang])}</h3><div class="pr gt">${esc(p.p[lang])}</div><ul>${p.f[lang].map(f => `<li>${esc(f)}</li>`).join('')}</ul><a class="btn fill" target="_blank" rel="noopener" href="${esc(wa(u.pkm + p.n[lang]))}">${u.pk}</a></div>`).join('');
  $('rvs').innerHTML = SITE.reviews.map(r => `<div class="glass rv rc"><p>“${esc(r.t[lang])}”</p><b>${esc(r.n[lang])}</b><small>${esc(r.r[lang])}</small></div>`).join('');
  watch();
}
function showHl(anim = true) {
  const s = SITE.services[hlI];
  $('hlt').innerHTML = `<b>${esc(s[lang][0])}</b><p style="color:var(--muted)">${esc(s[lang][1])}</p>`;
  if (anim) { $('hlt').classList.remove('sw'); void $('hlt').offsetWidth; $('hlt').classList.add('sw'); }
}
$('hl').onclick = e => { const b = e.target.closest('button'); if (!b) return; hlI = +b.dataset.k;
  document.querySelectorAll('#hl button').forEach(x => x.classList.toggle('on', x === b)); showHl(); };

$('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; cat = b.dataset.c;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.card').forEach(c => { const show = cat === 'all' || c.dataset.cat === cat;
    if (show) { c.style.display = ''; requestAnimationFrame(() => c.classList.remove('hide')); }
    else { c.classList.add('hide'); setTimeout(() => { if (c.classList.contains('hide')) c.style.display = 'none'; }, 400); } }); };

// نافذة البوست
function showPost() {
  const i = vis[cur], w = SITE.works[i];
  $('pm').innerHTML = `<span>${esc(w.title[lang])}</span><img src="${esc(w.img)}" alt="" onerror="this.remove()">`;
  $('lt').textContent = w.title[lang]; $('ld').textContent = w.desc[lang]; $('lc').textContent = '#' + catName(w.cat);
  $('ord').href = wa(UI[lang].ordm + w.title[lang]);
}
$('grid').onclick = e => { const c = e.target.closest('.card'); if (!c) return;
  vis = [...document.querySelectorAll('.card')].filter(x => x.style.display !== 'none').map(x => +x.dataset.idx);
  cur = vis.indexOf(+c.dataset.idx); showPost(); $('lb').classList.add('open'); };
const step = d => { cur = (cur + d + vis.length) % vis.length; showPost(); };
const closeLb = () => $('lb').classList.remove('open');
$('lbx').onclick = closeLb; $('lbp').onclick = () => step(-1); $('lbn').onclick = () => step(1);
$('lb').onclick = e => { if (e.target === $('lb')) closeLb(); };
document.onkeydown = e => { if (!$('lb').classList.contains('open')) return;
  if (e.key === 'Escape') closeLb(); if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); };

// اللغة والثيم
$('lang').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; store.set('lang', lang); render(); };
const setTheme = t => { root.dataset.theme = t; $('theme').textContent = t === 'dark' ? '☀️' : '🌙'; store.set('theme', t); };
setTheme(store.get('theme') || 'dark');
$('theme').onclick = () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');

// شريط التقدم + تمييز الرابط الحالي
const links = [...document.querySelectorAll('nav a.l')];
addEventListener('scroll', () => {
  $('bar').style.width = (scrollY / (document.body.scrollHeight - innerHeight) * 100) + '%';
  let cs = 'home'; ['home','info','works','contact'].forEach(id => { if ($(id).getBoundingClientRect().top < innerHeight * .4) cs = id; });
  links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + cs));
  navP(); bioP();
}, { passive: true });

// باراالاكس عند السكرول
if (!matchMedia('(prefers-reduced-motion:reduce)').matches) {
  const hg = document.querySelector('.hg'), bl = [...document.querySelectorAll('.blob')];
  addEventListener('scroll', () => { const y = scrollY; if (y > innerHeight * 1.3) return;
    hg.style.transform = `translateY(${y * .12}px)`; hg.style.opacity = Math.max(0, 1 - y / (innerHeight * .9));
    bl.forEach((b, i) => b.style.transform = `translateY(${y * (i ? -.18 : .22)}px)`); }, { passive: true });
}
// كلمات البايو بتنوّر مع السكرول + بيل النافيجيشن
function bioP() { const b = $('bio'), w = b.querySelectorAll('.sw'); if (!w.length) return;
  const n = Math.round((innerHeight * .9 - b.getBoundingClientRect().top) / (innerHeight * .45) * w.length);
  w.forEach((x, i) => x.classList.toggle('on', i < n)); }
function navP() { const a = document.querySelector('nav a.l.on'), p = $('np');
  if (!a) { p.style.width = '0'; return; } p.style.width = a.offsetWidth + 'px'; p.style.transform = `translateX(${a.offsetLeft}px)`; }
// شريط متحرك سرعته واتجاهه بيتحكم فيهم السكرول
{ const mts = [$('mq1'), $('mq2')], p = [0, 0], mq = mts[0].parentElement;
  let ly = scrollY, vel = 0, df = 1, hov = false;
  mq.onmouseenter = () => hov = true; mq.onmouseleave = () => hov = false;
  if (!matchMedia('(prefers-reduced-motion:reduce)').matches) (function m() {
    vel += (scrollY - ly - vel) * .12; ly = scrollY; df += ((vel < -1 ? -1 : 1) - df) * .06;
    mts.forEach((t, i) => { const h = t.scrollWidth / 2; if (!h) return;
      p[i] = (((p[i] + (i ? -1 : 1) * df * (hov ? .15 : 1) * (.8 + Math.min(Math.abs(vel), 40) * .35)) % h) + h) % h;
      t.style.transform = `translateX(${(lang === 'ar' ? 1 : -1) * p[i]}px)`; });
    requestAnimationFrame(m); })(); }
// تأثيرات الماوس
if (matchMedia('(hover:hover)').matches) {
  addEventListener('mousemove', e => { $('glow').style.left = e.clientX + 'px'; $('glow').style.top = e.clientY + 'px'; });
  { const cr = $('cr'), cd = $('cd'), sp = cr.firstChild, rm = matchMedia('(prefers-reduced-motion:reduce)').matches;
    let mx = 0, my = 0, rx = 0, ry = 0, on = false;
    addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY;
      if (!on) { on = true; rx = mx; ry = my; root.classList.add('cx'); cr.classList.add('on'); cd.classList.add('on'); }
      cd.style.transform = `translate3d(${mx}px,${my}px,0)`; });
    (function f() { rx += (mx - rx) * (rm ? 1 : .16); ry += (my - ry) * (rm ? 1 : .16);
      cr.style.transform = `translate3d(${rx}px,${ry}px,0)`; requestAnimationFrame(f); })();
    document.addEventListener('mouseover', e => { const t = e.target.closest('a,button,.card,input,textarea');
      const tx = !!t && t.matches('input,textarea'), v = !!t && t.matches('.card');
      cr.classList.toggle('x', tx); cd.classList.toggle('x', tx);
      cr.classList.toggle('v', v); cr.classList.toggle('h', !!t && !tx && !v);
      sp.textContent = v ? UI[lang].vw : ''; });
    addEventListener('mousedown', () => cr.classList.add('d')); addEventListener('mouseup', () => cr.classList.remove('d'));
    root.addEventListener('mouseleave', () => { cr.classList.remove('on'); cd.classList.remove('on'); });
    root.addEventListener('mouseenter', () => { if (on) { cr.classList.add('on'); cd.classList.add('on'); } }); }
  { let mb = null; const rmN = matchMedia('(prefers-reduced-motion:reduce)').matches;   // أزرار مغناطيسية
    addEventListener('mousemove', e => { root.style.setProperty('--gx', (e.clientX / innerWidth * 100) + '%');
      if (!rmN) { root.style.setProperty('--tx', ((e.clientX / innerWidth - .5) * 16) + 'px'); root.style.setProperty('--ty', ((e.clientY / innerHeight - .5) * 10) + 'px'); }
      const g = e.target.closest('.pkc,.rc,.stc,.prof');
      if (g) { const q = g.getBoundingClientRect(); g.style.setProperty('--mx', (e.clientX - q.left) + 'px'); g.style.setProperty('--my', (e.clientY - q.top) + 'px'); }
      const b = e.target.closest('.btn,.ib,.wab');
      if (mb && mb !== b) { mb.style.transform = ''; mb = null; }
      if (b) { mb = b; const r = b.getBoundingClientRect();
        b.style.transform = `translate(${(e.clientX - r.left - r.width / 2) * .28}px,${(e.clientY - r.top - r.height / 2) * .4}px)`; } }); }
  $('pw').addEventListener('mousemove', e => { const r = $('pw').getBoundingClientRect();
    $('phone').style.transform = `rotateY(${((e.clientX-r.left)/r.width-.5)*22}deg) rotateX(${-((e.clientY-r.top)/r.height-.5)*16}deg)`; });
  $('pw').addEventListener('mouseleave', () => $('phone').style.transform = '');
  $('grid').addEventListener('mousemove', e => { const c = e.target.closest('.card');
    document.querySelectorAll('.card').forEach(x => { if (x !== c) { x.style.setProperty('--rx','0deg'); x.style.setProperty('--ry','0deg'); } });
    if (c) { const r = c.getBoundingClientRect(); c.style.setProperty('--ry', ((e.clientX-r.left)/r.width-.5)*10+'deg'); c.style.setProperty('--rx', -((e.clientY-r.top)/r.height-.5)*10+'deg'); } });
}

// فورم التواصل (يفتح واتساب برسالة جاهزة)
$('form').onsubmit = e => { e.preventDefault();
  window.open(wa(UI[lang].subj + $('fn').value + '\n' + $('fm').value), '_blank'); };

render();
addEventListener('load', () => dispatchEvent(new Event('scroll')));
{ let n = 0; const t = setInterval(() => { n = Math.min(100, n + 3 + (Math.random() * 4 | 0)); $('pn').textContent = n + '%'; if (n >= 100) clearInterval(t); }, 45); }
setTimeout(() => $('pre').classList.add('go'), 1400);
</script>
